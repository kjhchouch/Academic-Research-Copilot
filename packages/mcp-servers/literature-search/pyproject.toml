[project]
name = "mcp-literature-search"
version = "0.1.0"
description = "MCP server: OpenAlex / Semantic Scholar search + CSL citation formatting"
requires-python = ">=3.12,<3.13"
dependencies = []

# D5 adds: "mcp[cli]", httpx, citeproc-py (or hand-rolled CSL for the 3 styles)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_literature_search"]
