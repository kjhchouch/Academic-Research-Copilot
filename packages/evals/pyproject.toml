[project]
name = "evals"
version = "0.1.0"
description = "Eval datasets and runners (routing, grounding, end-to-end)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "paper-agent",
]

[tool.uv.sources]
paper-agent = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.hatch.build.targets.wheel.force-include]
data = "evals/data"
