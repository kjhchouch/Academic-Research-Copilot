[project]
name = "paper-agent"
version = "0.1.0"
description = "Agent orchestration core: graph, routing, retrieval, grounding"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    # storage.py imports both (lazily, inside make_checkpointer), so they belong
    # here rather than in apps/api -- otherwise the agent package only works
    # because the workspace venv happens to install the union.
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
]

# D3 adds: langgraph-checkpoint-postgres, langchain-openai, langfuse
# D4 adds: typesafe-sdk
# D5 adds: mcp[cli]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]
