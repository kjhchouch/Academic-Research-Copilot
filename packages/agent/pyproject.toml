[project]
name = "paper-agent"
version = "0.1.0"
description = "Agent orchestration core: graph, routing, retrieval, grounding"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    # storage.py imports both (lazily, inside make_checkpointer), so they belong
    # here rather than in apps/api -- otherwise the agent package only works
    # because the workspace venv happens to install the union.
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    # AsyncSqliteSaver's driver. It was already importable transitively, so
    # declaring it is what turns "happens to work in this venv" into a guarantee.
    "aiosqlite>=0.22",
    "langchain-openai>=1.7.2",
    # >=5, not >=3: observability.py calls CallbackHandler() with no credentials,
    # which is the v5 signature. The v3 handler took public_key/secret_key/host
    # directly, so a v3 install would fail on an unexpected keyword argument --
    # loudly, at least, rather than silently tracing nothing.
    "langfuse>=5",
    "typesafe-sdk>=0.7.5",
]

# langgraph-checkpoint-postgres deliberately NOT added: retrieval and
# checkpointing both settled on SQLite (see README "开发计划" and devlog 坑 11).
# Add it in Week 4 if deployment actually needs Postgres.
# D5 adds: mcp[cli]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_agent"]
