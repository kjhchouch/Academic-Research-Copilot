# ===========================================================================
# Local infrastructure for Paper Agent.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# NOTE: Langfuse is deliberately NOT here. Self-hosting Langfuse v3 pulls in
# ClickHouse + a worker + a web service, which costs a full day of setup.
# Week 1-3 use Langfuse Cloud (free tier); self-hosting is a Week 4 task.
# ===========================================================================

name: paper-agent

services:
  postgres:
    # Official image with pgvector pre-built. Do NOT use plain `postgres`
    # and try to install the extension yourself.
    image: pgvector/pgvector:pg17
    container_name: pa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: pa-redis
    # Append-only persistence so the Jev decision cache survives restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: pa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console -> http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  # One-shot container that creates the `papers` bucket, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: pa-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/papers;
      echo 'bucket ready';
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
